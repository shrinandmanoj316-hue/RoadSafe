<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Pothole Detector</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
</head>
<body>
<h2>Pothole Detector</h2>

<input type="file" id="imageUpload" accept="image/*">
<canvas id="canvas"></canvas>

<script>
let model;

async function loadModel() {
    model = await tf.loadGraphModel('https://shrinandmanoj316.github.io/hue/model.json');
// your hosted model.json
    console.log("Model loaded");
}

loadModel();

document.getElementById('imageUpload').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    const img = new Image();
    img.src = URL.createObjectURL(file);

    img.onload = async () => {
        const canvas = document.getElementById('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(img, 0, 0);

        const tfImg = tf.browser.fromPixels(img).toFloat();
        const expandedImg = tfImg.expandDims(0);

        const predictions = await model.executeAsync(expandedImg);

        // Example: just log predictions for now
        console.log(predictions);
    };
});
</script>
</body>
</html>
