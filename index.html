<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Pothole Detector</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
</head>
<body>
<h2>Pothole Detector</h2>
<input type="file" id="imageUpload" accept="image/*">
<canvas id="canvas"></canvas>

<script>
let model;

// 1️⃣ Load your model from GitHub Pages
async function loadModel() {
    model = await tf.loadGraphModel('https://shrinandmanoj316.github.io/hue/model.json');
    console.log("Model loaded");
}
loadModel();

// 2️⃣ Handle image upload
document.getElementById('imageUpload').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    const img = new Image();
    img.src = URL.createObjectURL(file);

    img.onload = async () => {
        const canvas = document.getElementById('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(img, 0, 0);

        // 3️⃣ Convert image to tensor
        const tfImg = tf.browser.fromPixels(img).toFloat();
        const expandedImg = tfImg.expandDims(0);

        // 4️⃣ Run detection
        const predictions = await model.executeAsync(expandedImg);

        // 5️⃣ Draw bounding boxes
        // This depends on your model output, assuming boxes in predictions[0], classes in predictions[1]
        const boxes = await predictions[0].array(); 
        const classes = await predictions[1].array(); 
        const scores = await predictions[2].array(); // if your model has scores

        for(let i=0; i<boxes.length; i++){
            if(scores[i] > 0.5){ // only show confident detections
                const box = boxes[i]; // [ymin, xmin, ymax, xmax]
                const x = box[1] * img.width;
                const y = box[0] * img.height;
                const width = (box[3]-box[1]) * img.width;
                const height = (box[2]-box[0]) * img.height;

                ctx.strokeStyle = 'red';
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y, width, height);

                ctx.font = "16px Arial";
                ctx.fillStyle = 'red';
                ctx.fillText("Pothole", x, y > 10 ? y-5 : 10);
            }
        }

        tfImg.dispose();
        expandedImg.dispose();
    };
});
</script>
</body>
</html>
